# ClarityHub distributed backend.
# Each of the 4 domain services owns its own MySQL instance on purpose:
# there is no shared database, so one service (or its DB) going down never
# takes another one down with it. RabbitMQ is the only shared infrastructure
# piece, and only requirement-refiner-service depends on it being reachable
# to do useful work — everything else degrades gracefully without it.

services:
  # --- Message broker (decouples requirement-refiner from the rest) ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- idea-board-service ---
  idea-board-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: idea_board
    volumes:
      - idea_board_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  idea-board-service:
    build: ./backend/idea-board-service
    environment:
      PORT: 3001
      DATABASE_URL: mysql://root:root@idea-board-db:3306/idea_board?allowPublicKeyRetrieval=true
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3001:3001"
    depends_on:
      idea-board-db:
        condition: service_healthy

  # --- requirement-refiner-service ---
  # No database of its own — pure request/response over RabbitMQ. This is
  # the fragile, AI-dependent link the brief calls out: it can be stopped
  # independently (`docker compose stop requirement-refiner-service`) and
  # idea-board-service keeps serving traffic untouched.
  requirement-refiner-service:
    build: ./backend/requirement-refiner-service
    environment:
      PORT: 3002
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3002:3002"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # --- structure-service ---
  structure-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: structure
    volumes:
      - structure_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  structure-service:
    build: ./backend/structure-service
    environment:
      PORT: 3003
      DATABASE_URL: mysql://root:root@structure-db:3306/structure?allowPublicKeyRetrieval=true
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3003:3003"
    depends_on:
      structure-db:
        condition: service_healthy

  # --- jira-exporter-service ---
  jira-exporter-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jira_exporter
    volumes:
      - jira_exporter_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  jira-exporter-service:
    build: ./backend/jira-exporter-service
    environment:
      PORT: 3004
      DATABASE_URL: mysql://root:root@jira-exporter-db:3306/jira_exporter?allowPublicKeyRetrieval=true
      STRUCTURE_SERVICE_URL: http://structure-service:3003
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3004:3004"
    depends_on:
      jira-exporter-db:
        condition: service_healthy
      structure-service:
        condition: service_started

  # --- api-gateway ---
  # Single entry point for the frontend. Holds no business logic of its
  # own: pure proxy for idea-board/structure/jira-exporter, pure RabbitMQ
  # RPC translation for requirement-refiner. No dependency on the AI-backed
  # service being up — the gateway itself keeps serving every other route
  # even when requirement-refiner-service (or RabbitMQ) is stopped. It does
  # own one thing: the `users` table backing login (JwtAuthGuard requires a
  # valid bearer token on every route except /auth/* and /health*).
  auth-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth
    volumes:
      - auth_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./backend/api-gateway
    environment:
      PORT: 3000
      IDEA_BOARD_SERVICE_URL: http://idea-board-service:3001
      REQUIREMENT_REFINER_SERVICE_URL: http://requirement-refiner-service:3002
      STRUCTURE_SERVICE_URL: http://structure-service:3003
      JIRA_EXPORTER_SERVICE_URL: http://jira-exporter-service:3004
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: mysql://root:root@auth-db:3306/auth?allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      auth-db:
        condition: service_healthy
      idea-board-service:
        condition: service_started
      structure-service:
        condition: service_started
      jira-exporter-service:
        condition: service_started
      requirement-refiner-service:
        condition: service_started

volumes:
  idea_board_data:
  structure_data:
  jira_exporter_data:
  auth_data:
